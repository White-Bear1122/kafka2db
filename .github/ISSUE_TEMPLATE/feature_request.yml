name: Feature request
description: 提出功能或改进建议。
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 描述希望解决的问题及其影响。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的行为，以及可能涉及的配置或兼容性变化。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案和补充信息
      description: 可提供已尝试的替代方案或相关资料。
